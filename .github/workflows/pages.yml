name: Publicar en GitHub Pages

# Muestra el sitio de EstateOS (roofy) en https://toti-gauna.github.io/roofy/ para verlo funcionando mientras
# la publicación en Hostinger sigue apagada. Los PR solo construyen y prueban. Sigue siendo una publicación de
# prueba: noindex en cada página y robots.txt con Disallow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Pages sirve el proyecto bajo /<repo>.
  NEXT_PUBLIC_BASE_PATH: /roofy
  NEXT_PUBLIC_SITE_URL: https://toti-gauna.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (static export → out/)
        run: npm run build

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
