name: Build and publish EstateOS to Hostinger

# The build runs on every push and pull request. The PUBLICATION is off until someone turns it on:
# set the repository variable HOSTINGER_DEPLOY_ENABLED to "true" (see docs/despliegue.md). Nothing
# here is published on its own.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-estateos-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_PUBLIC_SITE_URL: https://roofy.eclipse-business.com
      NEXT_PUBLIC_ECLIPSE_URL: https://eclipse-business.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: bash -n scripts/hostinger-publish.sh scripts/hostinger-smoke.sh
      - run: npm run build
      - name: Include Hostinger routing
        run: cp deploy/hostinger.htaccess out/.htaccess
      - uses: actions/upload-artifact@v4
        with:
          name: estateos-site
          path: out/
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: hostinger-estateos
      url: https://roofy.eclipse-business.com
    env:
      # Same server and user as the Eclipse site; the PATH is the SUBDOMAIN's folder, never the
      # main site's public_html (the publish script refuses that one).
      HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ vars.HOSTINGER_PORT }}
      HOSTINGER_USER: ${{ vars.HOSTINGER_USER }}
      HOSTINGER_PATH: ${{ vars.HOSTINGER_PATH }}
      RELEASE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: estateos-site
          path: site
      - name: Configure verified SSH access
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST" && test -n "$HOSTINGER_PORT" && test -n "$HOSTINGER_USER" && test -n "$HOSTINGER_PATH"
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hostinger ~/.ssh/known_hosts
          ssh-keygen -F "[$HOSTINGER_HOST]:$HOSTINGER_PORT" -f ~/.ssh/known_hosts >/dev/null
      - name: Upload, back up, and publish
        shell: bash
        run: |
          set -euo pipefail
          ssh_args=(-p "$HOSTINGER_PORT" -i ~/.ssh/hostinger -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          destination="$HOSTINGER_USER@$HOSTINGER_HOST"
          domain_root="${HOSTINGER_PATH%%/public_html*}"
          stage="$domain_root/.eclipse-deploy-estateos/staging/$RELEASE"
          tar -cf "$RUNNER_TEMP/hostinger.tar" -C site .
          ssh "${ssh_args[@]}" "$destination" "umask 077; mkdir -p '$stage' && tar -xf - -C '$stage'" < "$RUNNER_TEMP/hostinger.tar"
          ssh "${ssh_args[@]}" "$destination" "bash -s -- publish '$HOSTINGER_PATH' '$RELEASE'" < scripts/hostinger-publish.sh
          if ! bash scripts/hostinger-smoke.sh; then
            echo 'Public checks failed; restoring the previous files.' >&2
            ssh "${ssh_args[@]}" "$destination" "bash -s -- rollback '$HOSTINGER_PATH' '$RELEASE'" < scripts/hostinger-publish.sh
            exit 1
          fi
      - name: Remove runner SSH files
        if: always()
        run: rm -f ~/.ssh/hostinger ~/.ssh/known_hosts
